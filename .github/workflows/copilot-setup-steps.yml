name: "Copilot Code Review Setup"

# This workflow prepares the execution environment for GitHub Copilot Code Review.
# Copilot's review agent runs this setup job before analyzing pull requests.
on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Desktop and Tablet Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f Catering_Present/jayraldines_catering/requirements.txt ]; then
            pip install -r Catering_Present/jayraldines_catering/requirements.txt
          fi
          if [ -f Tablet_PWA/backend/requirements.txt ]; then
            pip install -r Tablet_PWA/backend/requirements.txt
          fi
