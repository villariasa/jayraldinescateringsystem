name: Build Tablet Android APK

on:
  push:
    branches: [main, master]
    paths:
      - "Tablet_Android_APK/**"
      - "Tablet_PWA/**"
      - ".github/workflows/build-tablet-apk.yml"
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tablet_Android_APK

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Latest PWA Assets into Android APK
        run: |
          mkdir -p app/src/main/assets
          cp -r ../Tablet_PWA/frontend/* app/src/main/assets/
          chmod +x gradlew

      - name: Build Android APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jayraldines-Catering-Tablet-APK
          path: Tablet_Android_APK/app/build/outputs/apk/debug/*.apk
          retention-days: 30
