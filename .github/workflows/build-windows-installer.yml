name: Build Windows Desktop Installer (.EXE)

on:
  push:
    branches: [main, master]
    paths:
      - "Catering_Present/**"
      - "Tablet_PWA/**"
      - ".github/workflows/build-windows-installer.yml"
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build-windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Catering_Present/jayraldines_catering

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow psycopg2-binary requests

      - name: Download Windows Ngrok Binary
        run: |
          if (-not (Test-Path "tools")) { New-Item -ItemType Directory -Path "tools" | Out-Null }
          if (-not (Test-Path "tools\ngrok.exe")) {
            Write-Host "Downloading official Windows 64-bit Ngrok binary..."
            Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "tools\ngrok.zip"
            Expand-Archive -Path "tools\ngrok.zip" -DestinationPath "tools" -Force
            Remove-Item "tools\ngrok.zip" -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path "tools\ngrok.exe") {
            Write-Host "Ngrok binary ready at tools\ngrok.exe"
          } else {
            throw "Failed to obtain tools\ngrok.exe"
          }

      - name: Build PyInstaller Application Bundle
        run: |
          # Generate app.ico from logo if needed
          python -c "from PIL import Image; Image.open('assets/icons/logo.png').resize((256,256)).save('app.ico', format='ICO')"
          
          # Run PyInstaller
          pyinstaller --noconfirm --onedir --windowed `
            --name "JayraldinesCatering" `
            --icon "app.ico" `
            --add-data "assets;assets" `
            --add-data "ui;ui" `
            --add-data "styles;styles" `
            --add-data "version.py;." `
            --add-data "tools\ngrok.exe;tools" `
            --hidden-import "psycopg2" `
            --hidden-import "psycopg2.extensions" `
            --hidden-import "psycopg2.extras" `
            --hidden-import "reportlab" `
            --hidden-import "openpyxl" `
            --hidden-import "PIL" `
            --hidden-import "PIL.Image" `
            main.py

      - name: Compile Inno Setup Installer (.EXE)
        run: |
          if (-not (Test-Path "installer_output")) { New-Item -ItemType Directory -Path "installer_output" | Out-Null }
          ISCC.exe /O"installer_output" installer.iss

      - name: Verify Installer Output
        id: verify_installer
        run: |
          $installer = Get-ChildItem -Path "installer_output" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "No installer .exe generated in installer_output directory!"
          }
          Write-Host "Successfully generated installer: $($installer.FullName) ($([math]::Round($installer.Length / 1MB, 2)) MB)"
          echo "installer_path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          echo "installer_name=$($installer.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload Windows Installer (.EXE) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jayraldines_Catering_Windows_Setup_v4.1.15
          path: Catering_Present/jayraldines_catering/installer_output/*.exe
          retention-days: 30
