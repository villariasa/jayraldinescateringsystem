version: '{build}'

image: Visual Studio 2022

# We're building via a custom Python script (build_script below), not a
# Visual Studio project - without this, AppVeyor defaults to MSBuild mode,
# looks for a .sln/.vcxproj that doesn't exist, and fails before ever
# reaching install/build_script.
build: off

environment:
  PYTHON: "C:\\Python311-x64"
  APP_DIR: "Catering_Present\\jayraldines_catering"

init:
  - "%PYTHON%\\python.exe --version"

install:
  - "cd %APP_DIR%"
  - "%PYTHON%\\python.exe -m venv venv"
  - "venv\\Scripts\\python.exe -m pip install --upgrade pip"
  - "venv\\Scripts\\python.exe -m pip install -r requirements.txt"
  - "venv\\Scripts\\python.exe -m pip install pyinstaller pillow"

build_script:
  # No "cd %APP_DIR%" here - the working directory from the install step
  # (which already cd'd into %APP_DIR%) carries over into this step.
  - "venv\\Scripts\\python.exe seed_catering_db.py"
  - "venv\\Scripts\\python.exe build_installer.py"

artifacts:
  - path: "%APP_DIR%\\installer_output\\*.exe"
    name: installer

on_failure:
  - "if exist %APP_DIR%\\build\\jayraldines\\warn-jayraldines.txt type %APP_DIR%\\build\\jayraldines\\warn-jayraldines.txt"
