<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Jayraldine's Catering Kiosk</title>
<meta name="theme-color" content="#0B1220">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app-splash" class="app-splash">
  <div class="splash-content">
    <div id="splash-lottie-loader" class="splash-animation-stage"></div>
    <h1 class="splash-title">Jayraldine's Catering</h1>
    <p class="splash-subtitle">Preparing delicious catering experience…</p>
    <div class="splash-loader-progress">
      <div class="splash-loader-bar"></div>
    </div>
  </div>
</div>
<div id="app"></div>
<div id="overlay-root"></div>
<!-- Vendored libraries — the whole point of this app is that it works
     with zero network access after first install, so these are local
     files, never a CDN. sqlite.js/exporter.js/importer.js reference them
     as window.initSqlJs / window.jspdf / window.XLSX. -->
<script src="vendor/lottie.min.js" defer></script>
<script src="vendor/sql-wasm.js" defer></script>
<script src="vendor/jspdf.umd.min.js" defer></script>
<script src="vendor/xlsx.full.min.js" defer></script>
<script>
  window.addEventListener('error', (e) => {
    console.error('[Kiosk Window Error]', e.message, e.filename, e.lineno);
    const appEl = document.getElementById("app");
    if (appEl && (!appEl.hasChildNodes() || appEl.innerHTML.trim() === "")) {
      const splash = document.getElementById("app-splash");
      if (splash) splash.remove();
      appEl.innerHTML = '<div style="padding:40px;color:#fff;background:#0F172A;font-family:sans-serif;min-height:100vh;box-sizing:border-box;">'
        + '<h2 style="color:#EF4444;margin-top:0;">⚠️ Kiosk Initialization Error</h2>'
        + '<p style="color:#CBD5E1;font-size:14px;">An error occurred while loading the app:</p>'
        + '<pre style="background:#1E293B;padding:16px;border-radius:8px;color:#FCA5A5;white-space:pre-wrap;font-size:12px;">'
        + (e.message || 'Unknown error') + '\nLine: ' + (e.lineno || '?') + ' in ' + (e.filename || 'unknown')
        + '</pre>'
        + '<button onclick="location.reload()" style="background:#2563EB;color:#fff;border:none;padding:10px 20px;border-radius:6px;font-weight:700;cursor:pointer;margin-top:12px;">Retry</button>'
        + '</div>';
    }
  });
  window.addEventListener('unhandledrejection', (e) => {
    console.error('[Kiosk Unhandled Rejection]', e.reason);
  });
  // Fail-safe auto-dismiss: ensure splash screen NEVER traps the user on a blank screen
  window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      const splash = document.getElementById("app-splash");
      if (splash && !splash.classList.contains("hidden")) {
        splash.classList.add("hidden");
        setTimeout(() => splash.remove(), 400);
      }
    }, 1500);
  });
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
